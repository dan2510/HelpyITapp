<mat-toolbar class="header modern-header">
  <!-- Logo y título -->
  <div class="logo-section">
    <button mat-icon-button class="logo-button" matTooltip="La ventanita de GORROLES - Inicio" [routerLink]="['/inicio']">
      <img [src]="logoUrl" alt="La ventanita de GORROLES Logo" class="logo-image" (error)="onLogoError($event)" />
    </button>
    <span class="app-title">La ventanita de GORROLES</span>
  </div>

  <!-- Navegación principal -->
  <nav class="main-navigation">
    <button mat-button [routerLink]="['/inicio']" [routerLinkActive]="'active-nav-item'" class="nav-item">
      <mat-icon>home</mat-icon>
      <span>Inicio</span>
    </button>

<!-- Menú Órdenes -->
@if (authenticated()) {
<button mat-button [matMenuTriggerFor]="ordenesMenu" class="nav-item">
  <mat-icon>restaurant_menu</mat-icon>
  <span>Órdenes</span>
  <mat-icon class="dropdown-icon">keyboard_arrow_down</mat-icon>
</button>
<mat-menu #ordenesMenu="matMenu" class="modern-menu">
  <button mat-menu-item [routerLink]="['/ordenes']" [routerLinkActive]="'active-link'">
    <mat-icon>list</mat-icon>
    <span>@if (esAdmin()) { Todas las Órdenes } @else { Mis Órdenes }</span>
  </button>
  @if (esCliente() || esAdmin()) {
  <button mat-menu-item [routerLink]="['/ordenes/nuevo']" [routerLinkActive]="'active-link'">
    <mat-icon>add_circle_outline</mat-icon>
    <span>Crear Orden</span>
  </button>
  }
</mat-menu>
}


    <!-- Menú Categorías - Solo para ADMIN -->
    @if (esAdmin()) {
    <button mat-button [matMenuTriggerFor]="categoriasMenu" class="nav-item">
      <mat-icon>category</mat-icon>
      <span>Categorías</span>
      <mat-icon class="dropdown-icon">keyboard_arrow_down</mat-icon>
    </button>
    <mat-menu #categoriasMenu="matMenu" class="modern-menu">
      <button mat-menu-item [routerLink]="['/categorias-menu']" [routerLinkActive]="'active-link'">
        <mat-icon>list</mat-icon>
        <span>Lista de Categorías</span>
      </button>
      <button mat-menu-item [routerLink]="['/categorias-menu/nuevo']" [routerLinkActive]="'active-link'">
        <mat-icon>add_circle_outline</mat-icon>
        <span>Nueva Categoría</span>
      </button>
    </mat-menu>
    }

    <!-- Menú Productos - Para ADMIN -->
    @if (esAdmin()) {
    <button mat-button [matMenuTriggerFor]="productosMenu" class="nav-item">
      <mat-icon>restaurant</mat-icon>
      <span>Productos</span>
      <mat-icon class="dropdown-icon">keyboard_arrow_down</mat-icon>
    </button>
    <mat-menu #productosMenu="matMenu" class="modern-menu">
      <button mat-menu-item [routerLink]="['/productos']" [routerLinkActive]="'active-link'">
        <mat-icon>list</mat-icon>
        <span>Lista de Productos</span>
      </button>
      <button mat-menu-item [routerLink]="['/productos/nuevo']" [routerLinkActive]="'active-link'">
        <mat-icon>add_circle_outline</mat-icon>
        <span>Nuevo Producto</span>
      </button>
    </mat-menu>
    }

    <!-- Configuración - Solo para ADMIN -->
    @if (esAdmin()) {
    <button mat-button [routerLink]="['/configuracion']" [routerLinkActive]="'active-nav-item'" class="nav-item" matTooltip="Configuración del sistema">
      <mat-icon>settings</mat-icon>
      <span>Configuración</span>
    </button>
    }
    
  </nav>

  <!-- Spacer -->
  <div class="spacer"></div>

  <!-- Sección de usuario y notificaciones -->
  <div class="user-section">
    <!-- Notificaciones -->
    <button mat-icon-button class="notification-button" matTooltip="Notificaciones" 
            [matBadge]="cantidadNotificaciones().toString()" 
            matBadgeColor="warn" 
            [matBadgeHidden]="cantidadNotificaciones() === 0"
            [matMenuTriggerFor]="notificacionesMenu">
      <mat-icon>notifications</mat-icon>
    </button>
    <mat-menu #notificacionesMenu="matMenu" class="notificaciones-menu" xPosition="before">
      <app-notificaciones-panel></app-notificaciones-panel>
    </mat-menu>

    <!-- Usuario -->
    @if (authenticated()) {
    <div class="user-profile">
      <span class="user-email">{{ usuario()?.correo || 'Usuario' }}</span>
      <button mat-icon-button [matMenuTriggerFor]="userMenu" class="user-avatar">
        <div class="avatar-circle">
          <span>{{ getIniciales() }}</span>
        </div>
      </button>
      <mat-menu #userMenu="matMenu" class="modern-menu user-menu">
        <div class="user-info">
          <div class="user-avatar-large">
            <span>{{ getIniciales() }}</span>
          </div>
          <div class="user-details">
            <div class="user-name">{{ getNombreCompleto() }}</div>
            <div class="user-role">{{ getNombreRol() }}</div>
          </div>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Cerrar Sesión</span>
        </button>
      </mat-menu>
    </div>
    } @else {
    <button mat-button [routerLink]="['/usuario/login']" class="nav-item">
      <mat-icon>login</mat-icon>
      <span>Iniciar Sesión</span>
    </button>
    }
  </div>
</mat-toolbar>
